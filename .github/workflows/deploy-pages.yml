name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 1. Install root deps + generate API docs ────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Generate TypeDoc API docs
        run: npm run docs || echo "TypeDoc warnings are non-fatal, continuing…"

      # ── 2. Build the Vite demo app ──────────────────────────────────────
      - name: Install demo dependencies
        run: npm ci --prefix demo

      - name: Build demo
        run: npm run build --prefix demo

      # ── 3. Assemble the final site under docs/ ──────────────────────────
      #   docs/          ← TypeDoc generated HTML (API reference)
      #   docs/demo/     ← Vite demo build output
      - name: Copy demo build into docs/demo/
        run: |
          mkdir -p docs/demo
          cp -r demo/dist/. docs/demo/

      # ── 4. Deploy docs/ to GitHub Pages ─────────────────────────────────
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          force_orphan: true
