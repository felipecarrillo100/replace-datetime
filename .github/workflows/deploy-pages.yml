name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 1. Generate API docs → docs/
      - name: Install root dependencies
        run: npm ci

      - name: Generate TypeDoc API docs
        run: npm run docs || echo "TypeDoc warnings are non-fatal, continuing…"

      # 2. Build demo → docs/demo/  (outDir set in vite.config.ts)
      - name: Install demo dependencies
        run: npm ci --prefix demo

      - name: Build demo
        run: npm run demo:build

      # 3. Deploy the whole docs/ folder to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          force_orphan: true
